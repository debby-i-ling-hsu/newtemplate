# 本機開發：程式碼掛載進容器、hot reload、vite dev server。
# 一鍵啟動：make dev

x-app-environment: &app-environment
  DJANGO_ENV: dev
  DJANGO_SETTINGS_MODULE: config.settings.dev
  PYTHONPATH: /app/backend

x-worker: &worker
  build:
    context: .
    dockerfile: dockerfiles/Dockerfile.web
    target: celery-worker
  image: newtemplate-worker:dev
  restart: unless-stopped
  env_file:
    - ./backend/env/.env.dev
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - ./backend:/app/backend
  networks:
    - newtemplate_net

services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.web
      target: web
    image: newtemplate-web:dev
    restart: unless-stopped
    environment:
      <<: *app-environment
      LOG_SERVICE_NAME: web
      UVICORN_WORKERS: "1"
    env_file:
      - ./backend/env/.env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend:ro
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000 --nostatic"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/live/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - newtemplate_net

  worker-default:
    <<: *worker
    environment:
      <<: *app-environment
      LOG_SERVICE_NAME: worker-default
      CELERY_WORKER_NAME: worker-default
      CELERY_WORKER_QUEUES: default
      CELERY_WORKER_CONCURRENCY: "2"

  worker-maintenance:
    <<: *worker
    environment:
      <<: *app-environment
      LOG_SERVICE_NAME: worker-maintenance
      CELERY_WORKER_NAME: worker-maintenance
      CELERY_WORKER_QUEUES: maintenance
      CELERY_WORKER_CONCURRENCY: "1"

  worker-long-running:
    <<: *worker
    environment:
      <<: *app-environment
      LOG_SERVICE_NAME: worker-long-running
      CELERY_WORKER_NAME: worker-long-running
      CELERY_WORKER_QUEUES: long_running
      CELERY_WORKER_CONCURRENCY: "1"

  beat:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.web
      target: celery-beat
    image: newtemplate-beat:dev
    restart: unless-stopped
    environment:
      <<: *app-environment
      LOG_SERVICE_NAME: beat
    env_file:
      - ./backend/env/.env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - newtemplate_net

  vite:
    image: node:20-alpine
    container_name: newtemplate-vite
    restart: unless-stopped
    working_dir: /app/frontend
    command: >
      sh -c "npm install &&
      npm run build &&
      (npm run build -- --watch & npm run dev -- --host 0.0.0.0 --port 3000)"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - vite_node_modules:/app/frontend/node_modules
    environment:
      VITE_DEV_PROXY_TARGET: http://web:8000
    depends_on:
      web:
        condition: service_healthy
    networks:
      - newtemplate_net

  redis:
    image: redis:7-alpine
    container_name: newtemplate-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_dev_data:/data
    networks:
      - newtemplate_net

  db:
    image: postgres:16-alpine
    container_name: newtemplate-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fullstackapp
      POSTGRES_USER: fullstackapp
      POSTGRES_PASSWORD: fullstackapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - newtemplate_net

volumes:
  postgres_dev_data:
  redis_dev_data:
  vite_node_modules:

networks:
  newtemplate_net:
    driver: bridge
